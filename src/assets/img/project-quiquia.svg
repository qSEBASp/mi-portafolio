<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Quiqu.ia — coach de Valorant con IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171720"/>
      <stop offset="0.55" stop-color="#12121a"/>
      <stop offset="1" stop-color="#1b1020"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.22" cy="0.35" r="0.55">
      <stop stop-color="#dc2626" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.85" cy="0.85" r="0.6">
      <stop stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff7580"/>
      <stop offset="0.48" stop-color="#ff4655"/>
      <stop offset="1" stop-color="#a9152d"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d8b4fe"/>
      <stop offset="0.45" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="textFade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd9dd"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <rect width="1200" height="600" fill="url(#glowRed)"/>
  <rect width="1200" height="600" fill="url(#glowPurple)"/>

  <!-- Icono: lupa con la Q -->
  <g transform="translate(120 300)">
    <circle cx="0" cy="0" r="112" fill="#0f0f14" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="0" cy="-6" r="62" fill="none" stroke="url(#lens)" stroke-width="28"/>
    <path d="M34 30 80 76" stroke="url(#tail)" stroke-width="28" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif">
    <text x="310" y="286" font-size="104" font-weight="700" fill="url(#textFade)" letter-spacing="-2">Quiqu<tspan fill="#ff4655">.ia</tspan></text>
    <text x="314" y="350" font-size="34" font-weight="500" fill="#a0a0a8" letter-spacing="1">Coach de Valorant con IA</text>

    <!-- Chips -->
    <g font-size="22" font-weight="600">
      <rect x="314" y="392" width="118" height="44" rx="10" fill="#dc2626" fill-opacity="0.16" stroke="#dc2626" stroke-opacity="0.4"/>
      <text x="373" y="421" fill="#ff8a8a" text-anchor="middle">FastAPI</text>

      <rect x="444" y="392" width="118" height="44" rx="10" fill="#dc2626" fill-opacity="0.16" stroke="#dc2626" stroke-opacity="0.4"/>
      <text x="503" y="421" fill="#ff8a8a" text-anchor="middle">Next.js</text>

      <rect x="574" y="392" width="150" height="44" rx="10" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-opacity="0.45"/>
      <text x="649" y="421" fill="#c4b5fd" text-anchor="middle">IA · LLM</text>
    </g>
  </g>

  <!-- Detalle decorativo: barras de estadísticas -->
  <g transform="translate(860 150)" opacity="0.9">
    <rect x="0" y="0" width="250" height="300" rx="18" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
    <g fill="#ffffff" fill-opacity="0.10">
      <rect x="28" y="40" width="194" height="12" rx="6"/>
      <rect x="28" y="70" width="150" height="12" rx="6"/>
      <rect x="28" y="100" width="176" height="12" rx="6"/>
    </g>
    <g>
      <rect x="28" y="40" width="140" height="12" rx="6" fill="#dc2626"/>
      <rect x="28" y="70" width="104" height="12" rx="6" fill="#8b5cf6"/>
      <rect x="28" y="100" width="122" height="12" rx="6" fill="#10b981"/>
    </g>
    <g fill="#a0a0a8" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="17">
      <text x="28" y="152">Precisión</text>
      <text x="28" y="182">Utilidad</text>
      <text x="28" y="212">Impacto</text>
    </g>
    <g fill="#ffffff" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="end">
      <text x="222" y="152">72%</text>
      <text x="222" y="182">54%</text>
      <text x="222" y="212">63%</text>
    </g>
    <rect x="28" y="246" width="194" height="34" rx="10" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-opacity="0.4"/>
    <text x="125" y="269" fill="#ff8a8a" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Informe de coaching</text>
  </g>
</svg>
